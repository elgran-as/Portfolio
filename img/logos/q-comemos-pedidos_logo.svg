<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">Q´ Comemos Pedidos</title>
  <desc id="description">Logo de Q´ Comemos dentro de la pantalla de un teléfono.</desc>
  <defs>
    <linearGradient id="phone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#344b7a"/>
      <stop offset="1" stop-color="#1b2b4b"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="52" y="19" width="56" height="89" rx="8"/>
    </clipPath>
    <filter id="q-logo-blue" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".08 .36"/>
        <feFuncG type="table" tableValues=".19 .62"/>
        <feFuncB type="table" tableValues=".4 .96"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="46" y="11" width="68" height="106" rx="15" fill="url(#phone)"/>
  <rect x="52" y="19" width="56" height="89" rx="8" fill="#f3f6fc"/>
  <rect x="72" y="14" width="16" height="2.5" rx="1.25" fill="#93a1bd"/>
  <circle cx="80" cy="112" r="2" fill="#93a1bd"/>
  <g clip-path="url(#screen)">
    <rect x="52" y="19" width="56" height="89" fill="#f3f6fc"/>
    <image href="q-comemos_logo.png" x="56" y="37" width="48" height="48" preserveAspectRatio="xMidYMid meet" filter="url(#q-logo-blue)"/>
    <rect x="62" y="93" width="36" height="7" rx="3.5" fill="#5575c8"/>
    <rect x="71" y="95" width="18" height="2.5" rx="1.25" fill="#fff"/>
  </g>
</svg>
